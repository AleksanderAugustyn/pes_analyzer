[package]
name = "pes_analyzer"
version = "0.1.0"
edition = "2024"
description = "Fast saddle-point analysis on dense N-D PES grids"
license = "MIT"

[lib]
name = "pes_analyzer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
numpy = "0.22"
ndarray = "0.16"

[profile.release]
lto = "fat"
codegen-units = 1
