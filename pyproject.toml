[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pes_analyzer"
version = "0.8.0"
description = "Fast saddle-point analysis on dense N-D PES grids"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aleksander Augustyn", email = "aleksander.augustyn@ncbj.gov.pl" },
]
keywords = [
    "potential-energy-surface",
    "saddle-point",
    "watershed",
    "topology",
    "fission",
    "computational-chemistry",
]
dependencies = [
    "numpy >= 1.24",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/AleksanderAugustyn/pes_analyzer"
Repository = "https://github.com/AleksanderAugustyn/pes_analyzer"

[tool.maturin]
python-source = "python"
module-name = "pes_analyzer._native"
features = ["extension-module"]
include = ["python/pes_analyzer/_docs/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
